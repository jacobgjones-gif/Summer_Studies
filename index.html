<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Summer Learning 🐝</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--honey:#F5A623;--honey-dark:#D4861A;--honey-light:#FEF3DC;--green:#4CAF7D;--green-dark:#357A5A;--green-light:#E8F5EE;--blue:#4A90D9;--blue-light:#EAF2FB;--purple:#7B5EA7;--purple-light:#F0EBF8;--red:#E05252;--red-light:#FDEAEA;--bg:#FFFDF7;--card:#FFFFFF;--text:#2D2D2D;--text-muted:#7A7A7A;--border:#EAEAEA;--shadow:0 2px 12px rgba(0,0,0,0.08);--radius:14px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
h1,h2,h3,.label{font-family:'Nunito',sans-serif}
.app-header{background:linear-gradient(135deg,var(--honey) 0%,#F7C158 100%);padding:16px 16px 12px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(245,166,35,0.3)}
.app-header h1{font-size:21px;font-weight:900;color:#fff;letter-spacing:-0.3px}
.app-header .subtitle{font-size:12px;color:rgba(255,255,255,0.85);margin-top:2px}
.main-tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:62px;z-index:90;overflow-x:auto;scrollbar-width:none}
.main-tabs::-webkit-scrollbar{display:none}
.main-tab{flex-shrink:0;flex:1;padding:10px 6px;text-align:center;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--text-muted);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.2s;white-space:nowrap}
.main-tab.active{color:var(--honey-dark);border-bottom-color:var(--honey)}
.main-tab .tab-icon{font-size:17px;display:block;margin-bottom:1px}
.content{padding:14px 14px 0;max-width:680px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
.sub-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{flex-shrink:0;padding:7px 13px;border-radius:99px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;border:2px solid var(--border);background:var(--card);color:var(--text-muted);cursor:pointer;transition:all 0.18s;white-space:nowrap}
.sub-tab.active{background:var(--honey);border-color:var(--honey);color:#fff}
.sub-panel{display:none}.sub-panel.active{display:block}
.week-nav{display:flex;align-items:center;background:var(--card);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.week-nav-btn{background:var(--honey-light);border:none;border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--honey-dark);font-weight:900;display:flex;align-items:center;justify-content:center;transition:background 0.15s}
.week-nav-btn:disabled{opacity:0.3;cursor:not-allowed}
.week-nav-btn:not(:disabled):hover{background:var(--honey);color:#fff}
.week-nav-info{flex:1;text-align:center}
.week-nav-info .wk-label{font-family:'Nunito',sans-serif;font-size:16px;font-weight:800}
.week-nav-info .wk-dates{font-size:12px;color:var(--text-muted);margin-top:2px}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:10px 6px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-card .num{font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;color:var(--honey-dark)}
.stat-card .lbl{font-size:10px;color:var(--text-muted);margin-top:2px}
.prog-wrap{background:var(--border);border-radius:99px;height:8px;margin-bottom:14px;overflow:hidden}
.prog-bar{height:8px;background:linear-gradient(90deg,var(--honey),var(--green));border-radius:99px;transition:width 0.4s}
.section-label{font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.word-chip{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;transition:all 0.15s}
.word-chip.mastered{background:var(--green-light);border-color:var(--green);color:var(--green-dark)}
.word-chip .speak-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:0;flex-shrink:0}
.word-chip .check-btn{margin-left:auto;background:none;border:none;cursor:pointer;font-size:16px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:99px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;border:none;cursor:pointer;transition:all 0.18s}
.btn-primary{background:var(--honey);color:#fff;box-shadow:0 3px 8px rgba(245,166,35,0.35)}
.btn-primary:hover{background:var(--honey-dark)}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:var(--card);color:var(--text);border:2px solid var(--border)}
.btn-outline:hover{border-color:var(--honey);color:var(--honey-dark)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.btn-sm{padding:7px 12px;font-size:13px}
.practice-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px}
.practice-word{font-family:'Nunito',sans-serif;font-size:36px;font-weight:900;text-align:center;letter-spacing:2px;color:var(--text);margin:10px 0}
.practice-blanks{font-family:'Nunito',sans-serif;font-size:28px;font-weight:900;text-align:center;letter-spacing:8px;color:var(--text-muted);margin:10px 0}
.practice-hint{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:8px}
.input-row{display:flex;gap:8px;align-items:stretch}
.spell-input{flex:1;font-family:'Nunito',sans-serif;font-size:20px;font-weight:700;padding:10px 14px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--bg);color:var(--text);letter-spacing:2px;outline:none;transition:border-color 0.15s;width:100%}
.spell-input:focus{border-color:var(--honey)}
.submit-btn{background:var(--honey);border:none;border-radius:var(--radius-sm);padding:10px 16px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#fff;cursor:pointer;white-space:nowrap;transition:background 0.15s}
.submit-btn:hover{background:var(--honey-dark)}
.feedback{text-align:center;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;min-height:24px;margin-top:10px;border-radius:var(--radius-sm);padding:4px 8px}
.feedback.correct{color:var(--green-dark);background:var(--green-light)}
.feedback.wrong{color:var(--red);background:var(--red-light)}
.practice-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:8px;font-weight:600}
.action-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.results-card{background:var(--card);border-radius:var(--radius);padding:24px 18px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px}
.results-card .big-emoji{font-size:54px;margin-bottom:10px}
.results-card .result-title{font-family:'Nunito',sans-serif;font-size:22px;font-weight:900;margin-bottom:6px}
.results-card .result-score{font-size:15px;color:var(--text-muted);margin-bottom:14px}
.score-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--honey),var(--green));display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.score-circle span{font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;color:#fff}
.math-problem-card{background:var(--card);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px}
.math-equation{font-family:'Nunito',sans-serif;font-size:42px;font-weight:900;text-align:center;margin:12px 0;color:var(--text)}
.math-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.math-option{padding:14px 10px;border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:22px;font-weight:800;border:2.5px solid var(--border);background:var(--card);cursor:pointer;text-align:center;transition:all 0.15s;color:var(--text)}
.math-option:hover{border-color:var(--honey);background:var(--honey-light)}
.math-option.correct{border-color:var(--green);background:var(--green-light);color:var(--green-dark)}
.math-option.wrong{border-color:var(--red);background:var(--red-light);color:var(--red)}
.math-option.reveal-correct{border-color:var(--green);background:var(--green-light);color:var(--green-dark)}
.math-option:disabled{cursor:default}
.math-explanation{background:var(--blue-light);border-radius:var(--radius-sm);padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.6;color:var(--blue);font-weight:600;display:none}
.math-explanation.show{display:block}
.next-btn-wrap{text-align:center;margin-top:14px;display:none}
.next-btn-wrap.show{display:block}
.test-q{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:10px}
.test-q .q-num{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.test-input{width:100%;font-family:'Nunito',sans-serif;font-size:18px;font-weight:700;padding:10px 14px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--bg);color:var(--text);letter-spacing:2px;outline:none}
.test-input:focus{border-color:var(--honey)}
.test-input.correct{border-color:var(--green);background:var(--green-light);color:var(--green-dark)}
.test-input.wrong{border-color:var(--red);background:var(--red-light);color:var(--red)}
/* Parent summary */
.parent-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:540px){.parent-cols{grid-template-columns:1fr}}
.parent-col-hdr{font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;padding:7px 12px 5px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;margin-bottom:10px;border-bottom:2px solid}
.parent-col-hdr.spelling{color:var(--honey-dark);border-color:var(--honey);background:var(--honey-light)}
.parent-col-hdr.math{color:var(--blue);border-color:var(--blue);background:var(--blue-light)}
.summary-section{background:var(--card);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px}
.summary-section h3{font-size:14px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.week-summary-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.week-summary-row:last-child{border-bottom:none}
.week-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot-good{background:var(--green)}.dot-ok{background:var(--honey)}.dot-needs{background:var(--red)}.dot-untried{background:var(--border)}
.mini-prog-wrap{flex:1;background:var(--border);border-radius:99px;height:5px;overflow:hidden}
.mini-prog-bar{height:5px;border-radius:99px;transition:width 0.3s}
.math-table-bar{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.math-table-bar:last-child{border-bottom:none}
.insight-pill{display:inline-flex;align-items:center;gap:5px;background:var(--purple-light);color:var(--purple);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;margin:2px}
.missed-word-chip{display:inline-flex;align-items:center;gap:5px;background:var(--red-light);border:1.5px solid #F5B8B8;border-radius:var(--radius-sm);padding:5px 8px;font-size:13px;font-weight:700;color:var(--red);margin:2px;cursor:pointer}
.mastered-word-chip{display:inline-flex;align-items:center;gap:4px;background:var(--green-light);border:1.5px solid #A8DFC0;border-radius:var(--radius-sm);padding:4px 8px;font-size:12px;font-weight:700;color:var(--green-dark);margin:2px}
.pattern-badge{background:var(--honey-light);border:1.5px solid #F0C878;border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;margin-bottom:7px;line-height:1.5}
.pattern-insight-badge{background:var(--purple-light);border:1.5px solid #C8B8E8;border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;margin-bottom:7px;line-height:1.5;color:var(--purple);font-weight:600}
.math-insight-badge{background:var(--blue-light);border:1.5px solid #B5D4F4;border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;margin-bottom:7px;line-height:1.5;color:var(--blue);font-weight:600}
.summary-empty{text-align:center;padding:20px 10px;color:var(--text-muted);font-size:13px;line-height:1.6}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.celebrate{animation:bounce 0.5s ease}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:all 0.3s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.wk-section-hdr{font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;color:var(--honey-dark);background:var(--honey-light);border-radius:6px;padding:4px 10px;margin:10px 0 6px;display:inline-block}
.voice-bar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;border:1px solid var(--border);font-size:13px}
.voice-select{flex:1;font-family:'Nunito Sans',sans-serif;font-size:13px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none}
</style>
</head>
<body>
<div class="app-header">
  <h1>🐝 Summer Learning</h1>
  <p class="subtitle">Going into 2nd Grade — Summer 2026 &nbsp;<span id="sync-status" style="font-size:11px;opacity:0.85"></span></p>
</div>
<div class="main-tabs">
  <button class="main-tab active" onclick="switchMain('spelling')" id="mtab-spelling"><span class="tab-icon">📖</span>Spelling</button>
  <button class="main-tab" onclick="switchMain('math')" id="mtab-math"><span class="tab-icon">🔢</span>Math</button>
  <button class="main-tab" onclick="switchMain('parent')" id="mtab-parent"><span class="tab-icon">👨‍👩‍👧</span>Parent</button>
</div>
<div class="content">

<div class="panel active" id="panel-spelling">
  <div class="sub-tabs">
    <button class="sub-tab active" onclick="switchSub('spelling','practice')" id="stab-spelling-practice">Practice This Week</button>
    <button class="sub-tab" onclick="switchSub('spelling','allwords')" id="stab-spelling-allwords">All Words So Far</button>
    <button class="sub-tab" onclick="switchSub('spelling','test')" id="stab-spelling-test">Weekly Test</button>
  </div>
  <div class="sub-panel active" id="spanel-spelling-practice">
    <div id="s-voice-bar"></div>
    <div id="s-week-nav"></div>
    <div class="stats-bar" id="s-stats-bar"></div>
    <div class="prog-wrap"><div class="prog-bar" id="s-prog-bar"></div></div>
    <div id="s-practice-content"></div>
  </div>
  <div class="sub-panel" id="spanel-spelling-allwords">
    <div id="s-week-nav2"></div>
    <div id="s-all-words-content"></div>
  </div>
  <div class="sub-panel" id="spanel-spelling-test">
    <div id="s-week-nav3"></div>
    <div id="s-test-content"></div>
  </div>
</div>

<div class="panel" id="panel-math">
  <div class="sub-tabs">
    <button class="sub-tab active" onclick="switchSub('math','practice')" id="stab-math-practice">Practice This Week</button>
    <button class="sub-tab" onclick="switchSub('math','test')" id="stab-math-test">Weekly Test</button>
  </div>
  <div class="sub-panel active" id="spanel-math-practice">
    <div id="m-week-nav"></div>
    <div id="m-practice-content"></div>
  </div>
  <div class="sub-panel" id="spanel-math-test">
    <div id="m-week-nav2"></div>
    <div id="m-test-content"></div>
  </div>
</div>

<div class="panel" id="panel-parent">
  <div id="parent-content"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── WORD BANKS ────────────────────────────────────────────────────────────
const BASE_WEEKS = [
  ["again","away","every","found","give","going","great","help","little","made","one","open","over","put","round"],
  ["also","always","because","before","carry","clean","draw","drink","eight","fall","far","full","got","grow","has"],
  ["hold","hot","hurt","keep","kind","laugh","light","long","myself","never","only","own","pick","seven","shall"],
  ["show","six","sleep","small","start","ten","today","together","try","warm","wash","which","why","wish","write"],
  ["about","better","cold","cut","done","fast","first","fly","goes","green","just","live","may","once","of"],
  ["please","pretty","right","run","say","soon","stop","take","thank","think","those","upon","use","very","walk"],
  ["were","when","where","who","would","yes","your","black","brown","buy","four","funny","gave","how","into"],
  ["could","does","eat","jump","know","let","much","new","now","off","old","our","out","pull","read"],
  ["ride","seen","sing","sit","tell","their","them","these","too","two","us","want","well","went","what"],
  ["work","around","both","drop","even","find","look","more","must","next","play","call","came","don't","her"],
  ["after","ask","back","bring","any","each","end","him","his","need","from","had","he","she","they"]
];
const EXTRA_WEEKS = [
  ["across","along","another","answer","bed","between","change","children","close","color","copy","door","down","during","easy"],
  ["eyes","face","family","follow","food","form","game","girl","hard","head","hear","high","home","idea","important"],
  ["land","large","last","later","learn","leave","letter","line","list","mother","mountain","move","name","near","night"],
  ["nothing","often","other","page","paper","plant","point","river","school","sentence","side","something","sometimes","sound","story"],
  ["study","such","sure","swim","thought","through","true","turn","under","until","watch","while","word","world","year"],
  ["young","above","already","although","among","began","being","below","body","book","care","city","complete","contain","cross"],
  ["deep","early","earth","enough","ever","field","fish","force","front","given","group","heart","heavy","horse","hundred"],
  ["ice","known","country","different","example","finally","friend","glad","gone","happened","money","morning","outside","place","plan"],
  ["problem","question","quickly","ready","second","since","someone","special","stand","strong","thing","town","voice","water","whole"],
  ["yellow","zero","air","almost","animal","ball","bird","boat","bone","bug","bush","cake","camp","cave","check"],
  ["chip","clock","club","coat","corn","cost","crop","cup","dark","desk","dirt","dish","dock","dust","flag"]
];
const WORD_BANK = BASE_WEEKS;

// ── MATH CONFIG ────────────────────────────────────────────────────────────
const MATH_WEEKS = [
  {concept:"Counting groups",tables:[1,2],maxFactor:5,description:"Groups of 1 and 2"},
  {concept:"Multiplying by 2",tables:[2],maxFactor:10,description:"Times tables for 2"},
  {concept:"Multiplying by 5",tables:[5],maxFactor:10,description:"Times tables for 5"},
  {concept:"Multiplying by 10",tables:[10],maxFactor:10,description:"Times tables for 10"},
  {concept:"2s and 5s mixed",tables:[2,5],maxFactor:10,description:"Mix of 2s and 5s"},
  {concept:"Multiplying by 3",tables:[3],maxFactor:10,description:"Times tables for 3"},
  {concept:"Multiplying by 4",tables:[4],maxFactor:10,description:"Times tables for 4"},
  {concept:"3s and 4s mixed",tables:[3,4],maxFactor:10,description:"Mix of 3s and 4s"},
  {concept:"All tables 2–5",tables:[2,3,4,5],maxFactor:10,description:"Mix of 2, 3, 4, 5"},
  {concept:"Multiplying by 6",tables:[6],maxFactor:10,description:"Times tables for 6"},
  {concept:"All tables 2–10",tables:[2,3,4,5,6,7,8,9,10],maxFactor:10,description:"Full times tables"}
];

const START_DATE = new Date(2026,5,1);

// ── STATE ─────────────────────────────────────────────────────────────────
let sWeek=0, learned={}, extraWordCount=[], missedWords={}, mathMissed={};
let sPracticeState=null, sTestState=null;
let mWeek=0, mPracticeState=null, mTestState=null;
let voices=[], selectedVoice=null, voiceInitialized=false;

// ── VOICE ─────────────────────────────────────────────────────────────────
const VOICE_PRIORITY=['Samantha (Enhanced)','Samantha','Karen (Enhanced)','Karen','Moira (Enhanced)','Moira',
  'Tessa (Enhanced)','Tessa','Allison (Enhanced)','Allison','Ava (Enhanced)','Ava',
  'Google US English','Google UK English Female',
  'Microsoft Aria Online (Natural)','Microsoft Aria','Microsoft Jenny Online (Natural)','Microsoft Jenny',
  'Microsoft Zira Online (Natural)','Microsoft Zira'];

function scoreVoice(v){
  if(!v.lang.startsWith('en')) return -1;
  let n=v.name;
  if(/online.*natural|natural.*online/i.test(n)) return 100;
  if(/enhanced/i.test(n)) return 90;
  if(/google/i.test(n)&&v.lang==='en-US') return 85;
  if(/google/i.test(n)) return 80;
  for(let i=0;i<VOICE_PRIORITY.length;i++) if(n.includes(VOICE_PRIORITY[i])) return 75-i;
  if(v.lang==='en-US') return 20;

// ── MATH PROBLEM GENERATOR ────────────────────────────────────────────────
function getMathExplanation(a,b,product){
  if(a===2||b===2) return 'Doubling! '+Math.max(a,b)+' + '+Math.max(a,b)+' = '+product;
  if(a===5||b===5) return 'Count by 5s, '+Math.max(a,b)+' times: '+Array(Math.max(a,b)).fill(0).map((_,i)=>(i+1)*5).join(', ')+' → '+product;
  if(a===10||b===10) return 'Multiply by 10: just add a zero! '+Math.min(a,b)+' × 10 = '+product;
  return a+' × '+b+' = '+product+'. Think of '+a+' groups with '+b+' in each: '+Array(a).fill(b).join(' + ')+' = '+product;
}
function generateMathProblems(weekIdx,count,seed){
  var cfg=MATH_WEEKS[Math.min(weekIdx,MATH_WEEKS.length-1)];
  var rng=(seed||1234)&0x7fffffff;
  function rand(n){rng=(rng*1664525+1013904223)&0x7fffffff;return rng%n;}
  var combos=[];
  for(var ti=0;ti<cfg.tables.length;ti++){var t=cfg.tables[ti];for(var f=1;f<=cfg.maxFactor;f++) combos.push({a:t,b:f,product:t*f});}
  for(var i=combos.length-1;i>0;i--){var j=rand(i+1);var tmp=combos[i];combos[i]=combos[j];combos[j]=tmp;}
  var sel=combos.slice(0,Math.min(count,combos.length));
  return sel.map(function(p){
    var product=p.product, ws={};
    var offsets=[1,2,3,4,5,6,7,8,10];
    for(var i=offsets.length-1;i>0;i--){var j=rand(i+1);var t=offsets[i];offsets[i]=offsets[j];offsets[j]=t;}
    var wi=0;
    while(Object.keys(ws).length<3&&wi<offsets.length*2){var o=offsets[wi%offsets.length],s=(wi%2===0)?1:-1,w=product+s*o;if(w>0&&w!==product&&!ws[w])ws[w]=true;wi++;}
    var fb=1; while(Object.keys(ws).length<3){if(fb!==product&&fb>0)ws[fb]=true;fb++;}
    var opts=[product].concat(Object.keys(ws).map(Number));
    for(var i=opts.length-1;i>0;i--){var j=rand(i+1);var t=opts[i];opts[i]=opts[j];opts[j]=t;}
    return{a:p.a,b:p.b,product:product,options:opts,explanation:getMathExplanation(p.a,p.b,product)};
  });
}

// ── PARENT SUMMARY ────────────────────────────────────────────────────────
function analyzeSpellingPatterns(missedList){
  if(!missedList.length)return[];
  var insights=[];
  var digraphs=[
    {pat:/th/,label:'"th" words (e.g. think, those, which) — very common miss!'},
    {pat:/wh/,label:'"wh" question words (when, where, which, why)'},
    {pat:/sh/,label:'"sh" sound (shall, show, wish)'},
    {pat:/ch/,label:'"ch" sound — check these carefully'},
    {pat:/ck/,label:'"ck" ending (black, pick, back)'},
    {pat:/ough/,label:'"ough" pattern — one of the trickiest in English! (thought, through)'},
    {pat:/wr/,label:'"wr" words — the W is silent! (write, wrong)'},
    {pat:/kn/,label:'"kn" words — the K is silent! (know, knew, knock)'},
    {pat:/ou/,label:'"ou" vowel pattern (found, around, our, out, would)'},
    {pat:/oo/,label:'"oo" vowel pattern (too, soon, look, good)'},
    {pat:/ea/,label:'"ea" vowel pattern (each, eat, read, clean, please)'},
    {pat:/ee/,label:'"ee" vowel pattern (seen, need, been, sleep, three)'},
    {pat:/ight/,label:'"ight" pattern (right, light, night, might)'},
    {pat:/all/,label:'"all" pattern (call, fall, small, tall, walk)'},
    {pat:/ing/,label:'"ing" ending (going, bring, sing, long)'},
    {pat:/ay/,label:'"ay" pattern (away, play, say, today, carry)'},
  ];
  var hits={};
  digraphs.forEach(function(d){
    var matched=missedList.filter(function(w){return d.pat.test(w);});
    if(matched.length>=2)hits[d.label]={count:matched.length,words:matched.slice(0,4)};
  });
  // Double letters
  var dbl=missedList.filter(function(w){return(/(.)\1/).test(w);});
  if(dbl.length>=2)hits['Double letters inside words (e.g. '+dbl.slice(0,3).join(', ')+')']={count:dbl.length,words:dbl};
  // Silent e
  var silentE=missedList.filter(function(w){return w.endsWith('e')&&w.length>3;});
  if(silentE.length>=2)hits['Words ending in silent "e" (give, made, have, write)']={count:silentE.length,words:silentE};
  // Contractions
  var contractions=missedList.filter(function(w){return w.includes("'");});
  if(contractions.length>=1)insights.push({text:"Contractions (don't, can't) — easy to forget the apostrophe!",level:'warn'});
  // Word length
  var long=missedList.filter(function(w){return w.length>=7;});
  if(long.length>=2)insights.push({text:'Longer words are harder: '+long.slice(0,4).join(', ')+' — try breaking them into syllables',level:'warn'});
  var short=missedList.filter(function(w){return w.length<=3;});
  if(short.length>=2)insights.push({text:'Short sight words still need work: '+short.join(', ')+' — these should become automatic with daily reading',level:'warn'});
  // Sort pattern hits by count, add to insights
  Object.entries(hits).sort(function(a,b){return b[1].count-a[1].count;}).forEach(function(entry){
    insights.push({text:entry[0]+' — missed: '+entry[1].words.join(', '),level:'pattern'});
  });
  return insights;
}

function analyzeMathPatterns(){
  var entries=Object.values(mathMissed).filter(function(d){return d.attempts>0;});
  if(!entries.length)return{tableStats:[],insights:[],hardCombos:[]};
  // Per-table accuracy
  var tableMap={};
  entries.forEach(function(d){
    [d.a,d.b].forEach(function(num){
      if(!tableMap[num])tableMap[num]={missed:0,attempts:0};
      tableMap[num].missed+=d.missed;
      tableMap[num].attempts+=d.attempts;
    });
  });
  var tableStats=Object.keys(tableMap).map(function(n){
    var s=tableMap[n];
    return{n:parseInt(n),missed:s.missed,attempts:s.attempts,acc:s.attempts>0?Math.round((s.attempts-s.missed)/s.attempts*100):0};
  }).filter(function(t){return t.n>0;}).sort(function(a,b){return a.acc-b.acc;});
  // Hardest combos
  var hardCombos=entries.filter(function(d){return d.missed>0;}).map(function(d){
    return{label:d.a+' × '+d.b+' = '+(d.a*d.b),missed:d.missed,attempts:d.attempts,
      errorRate:Math.round(d.missed/d.attempts*100)};
  }).sort(function(a,b){return b.errorRate-a.errorRate||b.missed-a.missed;}).slice(0,6);
  // Insights
  var insights=[];
  var hard=tableStats.filter(function(t){return t.acc<60&&t.attempts>=2;});
  if(hard.length)insights.push('The ×'+hard.map(function(t){return t.n;}).join(', ×')+' table'+(hard.length>1?'s are':' is')+' the toughest — try counting by those numbers out loud every day.');
  var solid=tableStats.filter(function(t){return t.acc>=90&&t.attempts>=3;});
  if(solid.length)insights.push('The ×'+solid.map(function(t){return t.n;}).join(', ×')+' table'+(solid.length>1?'s are':' is')+' solid — great memorization!');
  var bigProds=entries.filter(function(d){return d.missed>0&&d.a*d.b>=24;});
  if(bigProds.length>=2)insights.push('Larger products (24+) are causing trouble — try using the explanation hints after each problem to see the pattern.');
  var smallFacts=entries.filter(function(d){return d.missed>0&&d.a*d.b<=6&&d.attempts>=2;});
  if(smallFacts.length>=2)insights.push('Small facts like '+smallFacts.slice(0,3).map(function(d){return d.a+'×'+d.b;}).join(', ')+' still need work — these should become instant recall!');
  return{tableStats:tableStats,insights:insights,hardCombos:hardCombos};
}

  var persistentMisses=missedEntries.filter(function(e){return e[1].missed>=2&&!learned[e[0]];});
  var onceWrong=missedEntries.filter(function(e){return e[1].missed===1&&!learned[e[0]];});
  var missedNames=missedEntries.map(function(e){return e[0];});
  var spellingInsights=analyzeSpellingPatterns(missedNames);

      +(pct>=80?'var(--green-dark)':pct>=50?'var(--honey-dark)':'var(--red)')+'">'+pct+'%</div>'
      +'</div>';
  }).join('');

  // ── MATH DATA ──
  var mathData=analyzeMathPatterns();
  var mathHasData=Object.keys(mathMissed).length>0;

  var mathWeekRows=MATH_WEEKS.map(function(cfg,i){
    var wkEntries=Object.values(mathMissed).filter(function(d){return cfg.tables.indexOf(d.a)>=0||cfg.tables.indexOf(d.b)>=0;});
    var att=wkEntries.reduce(function(s,d){return s+d.attempts;},0);
    var mis=wkEntries.reduce(function(s,d){return s+d.missed;},0);
    var pct=att>0?Math.round((att-mis)/att*100):-1;
    var dotC=pct<0?'dot-untried':pct>=80?'dot-good':pct>=50?'dot-ok':'dot-needs';
    return '<div class="week-summary-row">'
      +'<div class="week-dot '+dotC+'"></div>'
      +'<div style="flex:1"><span style="font-weight:700">Wk '+(i+1)+'</span>'
      +'<span style="color:var(--text-muted);font-size:11px"> ×'+cfg.tables.join(',×')+'</span></div>'
      +'<div style="font-size:12px;font-weight:700;min-width:30px;text-align:right;color:'
      +(pct<0?'var(--text-muted)':pct>=80?'var(--green-dark)':pct>=50?'var(--honey-dark)':'var(--red)')+'">'+
      (pct<0?'—':pct+'%')+'</div></div>';
  }).join('');

  var mathTableBars=mathData.tableStats.slice(0,10).map(function(t){
    var pct=t.acc,barColor=pct>=80?'var(--green)':pct>=50?'var(--honey)':'var(--red)';
    return '<div class="math-table-bar">'
      +'<span style="font-family:Nunito,sans-serif;font-weight:800;font-size:13px;min-width:28px">×'+t.n+'</span>'
      +'<div class="mini-prog-wrap"><div class="mini-prog-bar" style="width:'+pct+'%;background:'+barColor+'"></div></div>'
      +'<span style="font-size:12px;font-weight:700;min-width:30px;text-align:right;color:'
      +(pct>=80?'var(--green-dark)':pct>=50?'var(--honey-dark)':'var(--red)')+'">'+pct+'%</span>'
      +'<span style="font-size:11px;color:var(--text-muted);white-space:nowrap">'+t.attempts+' tries</span></div>';
  }).join('');

  var hardCombosHTML=mathData.hardCombos.map(function(c){
    return '<span style="display:inline-flex;align-items:center;gap:4px;background:var(--red-light);border:1.5px solid #F5B8B8;border-radius:var(--radius-sm);padding:5px 8px;margin:2px;font-size:12px;font-weight:700;color:var(--red)">'
      +c.label+' <span style="font-size:10px;color:var(--text-muted);font-weight:400">('+c.errorRate+'% wrong)</span></span>';
  }).join('');

  // ── BUILD SPELLING COLUMN ──
  var spellingInsightHTML=spellingInsights.map(function(ins){
    return '<div class="'+(ins.level==='pattern'?'pattern-insight-badge':'pattern-badge')+'">'
      +(ins.level==='pattern'?'🔤 ':'⚠️ ')+ins.text+'</div>';
  }).join('');

  var troubleHTML='';
  if(persistentMisses.length){
    troubleHTML='<div class="summary-section"><h3>⚠️ Needs Extra Help</h3>'
      +persistentMisses.map(function(e){var w=e[0],d=e[1];
        return '<div class="pattern-badge" style="display:flex;align-items:center;gap:8px">'
          +'<span style="font-family:Nunito,sans-serif;font-size:16px;font-weight:900">'+w+'</span>'
          +'<span style="font-size:11px;color:var(--text-muted)">missed '+d.missed+'× / '+d.attempts+'</span>'
          +'<button class="speak-btn" onclick="speak(\''+w+'\')" style="margin-left:auto">🔊</button></div>';
      }).join('')+'</div>';
  }
  var stumbledHTML='';
  if(onceWrong.length){
    stumbledHTML='<div class="summary-section"><h3>📝 Stumbled Once</h3><div>'
      +onceWrong.slice(0,10).map(function(e){return '<span class="missed-word-chip" onclick="speak(\''+e[0]+'\')">'+e[0]+' 🔊</span>';}).join('')
      +'</div></div>';
  }
  var masteredHTML='';
  if(masteredCount>0){
    masteredHTML='<div class="summary-section"><h3>🌟 Mastered</h3><div>'
      +uniqueWords.filter(function(w){return learned[w];}).map(function(w){return '<span class="mastered-word-chip">✓ '+w+'</span>';}).join('')
      +'</div></div>';
  }

  var spellingCol=
    '<div class="parent-col-hdr spelling">📖 Spelling</div>'
    +'<div class="summary-section">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'
        +'<div style="flex:1"><div style="font-family:Nunito,sans-serif;font-size:22px;font-weight:900;color:var(--honey-dark)">'+masteredCount+'/'+totalWords+'</div>'
        +'<div style="font-size:12px;color:var(--text-muted)">words mastered</div></div>'
        +'<div style="width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--green) '+donutDeg+'deg,var(--border) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0">'
        +'<div style="width:36px;height:36px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;font-family:Nunito,sans-serif;font-size:11px;font-weight:900;color:var(--green-dark)">'+overallPct+'%</div>'
        +'</div></div>'
      +'<div class="prog-wrap" style="margin-bottom:0"><div class="prog-bar" style="width:'+overallPct+'%"></div></div>'
    +'</div>'
    +'<div class="summary-section"><h3>📅 By Week</h3>'+spellingWeekRows+'</div>'
    +(masteredCount===0&&missedEntries.length===0?'<div class="summary-empty"><div style="font-size:32px">📖</div><p style="margin-top:6px">No spelling data yet. Start practicing!</p></div>':'')
    +(spellingInsights.length?'<div class="summary-section"><h3>🔍 Pattern Insights</h3>'+spellingInsightHTML+'</div>':'')
    +(missedEntries.length>0&&spellingInsights.length===0?'<div class="summary-section" style="text-align:center;color:var(--text-muted);font-size:13px"><p>Keep practicing — patterns will appear here as more words are missed.</p></div>':'')
    +troubleHTML+stumbledHTML+masteredHTML;

  // ── BUILD MATH COLUMN ──
  var mathInsightBadges=mathData.insights.map(function(ins){return '<div class="math-insight-badge">💡 '+ins+'</div>';}).join('');

  var mathCol=
    '<div class="parent-col-hdr math">🔢 Math</div>'
    +'<div class="summary-section"><h3>📅 By Week</h3>'+mathWeekRows+'</div>'
    +(!mathHasData?'<div class="summary-empty"><div style="font-size:32px">🔢</div><p style="margin-top:6px">No math data yet. Complete some practice or tests!</p></div>':'')
    +(mathHasData&&mathData.tableStats.length?'<div class="summary-section"><h3>× Table Accuracy</h3>'+mathTableBars+'</div>':'')
    +(mathData.hardCombos.length?'<div class="summary-section"><h3>⚠️ Trickiest Problems</h3><div>'+hardCombosHTML+'</div></div>':'')
    +(mathInsightBadges?'<div class="summary-section"><h3>💡 Insights</h3>'+mathInsightBadges+'</div>':'');

  document.getElementById('parent-content').innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
      +'<div><div style="font-family:Nunito,sans-serif;font-size:18px;font-weight:900">Parent Summary</div>'
      +'<div style="font-size:13px;color:var(--text-muted)">Progress & insights</div></div>'
      +'<button class="btn btn-outline btn-sm" onclick="renderParentSummary()">🔄 Refresh</button>'
    +'</div>'
    +'<div class="parent-cols"><div>'+spellingCol+'</div><div>'+mathCol+'</div></div>'
    +'<div style="text-align:center;padding:10px 0 20px">'
      +'<button class="btn btn-outline" onclick="resetAllProgress()" style="border-color:var(--red);color:var(--red)">🗑 Reset All Progress</button>'
      +'<div id="reset-confirm-area"></div>'
    +'</div>';
}

// ── INIT ──────────────────────────────────────────────────────────────────
async function init(){
  // Load from localStorage instantly so UI isn't blank
  loadSave();
  sWeek=todayWeek(); mWeek=todayWeek();
  initVoices();
  renderSpelling();
  renderMath();
  // Then load from Supabase and re-render with cloud data
  await loadFromSupabase();
  renderSpelling();
  renderMath();
}
init();
</script>
</body>
</html>
